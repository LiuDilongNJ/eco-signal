# Server for API domain: api.*
server {
    listen 80;
    server_name ~^api\.;

    server_tokens off;
    default_type application/json;

    add_header Retry-After 30 always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    location / {
        return 503 '{"status":503,"error":"system_maintenance","message":"ecoSignal is currently undergoing maintenance. Please try again shortly."}\n';
    }
}

# Default server for web dashboard and pages
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    add_header Retry-After 30 always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    error_page 503 /index.html;

    location = /index.html {
        internal;
    }

    # API endpoints under path /api/ return JSON
    location /api/ {
        default_type application/json;
        return 503 '{"status":503,"error":"system_maintenance","message":"ecoSignal is currently undergoing maintenance. Please try again shortly."}\n';
    }

    # Web page requests return 503 and render maintenance HTML
    location / {
        return 503;
    }
}
