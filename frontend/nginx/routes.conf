    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    # Dedicated maintenance error handler
    error_page 503 @maintenance;
    location @maintenance {
        add_header Retry-After 30 always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        root /usr/share/nginx/maintenance;
        try_files /index.html =503;
    }

    location /api/ {
        default_type application/json;
        if (-f /usr/share/nginx/maintenance/maintenance.flag) {
            return 503 '{"status":503,"error":"system_maintenance","message":"ecoSignal is currently undergoing maintenance. Please try again shortly."}\n';
        }
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /sounds/tmp/ {
        return 404;
    }

    location /sounds/ {
        if (-f /usr/share/nginx/maintenance/maintenance.flag) {
            return 503;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }

        alias /usr/share/nginx/media/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ~ ^/api/v1/file-upload-batches/[^/]+/chunks$ {
        default_type application/json;
        if (-f /usr/share/nginx/maintenance/maintenance.flag) {
            return 503 '{"status":503,"error":"system_maintenance","message":"ecoSignal is currently undergoing maintenance. Please try again shortly."}\n';
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # W3C change-password well-known URL for password-manager UX
    location = /.well-known/change-password {
        return 302 /settings?tab=profile&changePassword=1;
    }

    location / {
        if (-f /usr/share/nginx/maintenance/maintenance.flag) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
