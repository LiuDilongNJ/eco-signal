services:
  maintenance:
    image: ${NGINX_BASE_IMAGE:-nginx:alpine}
    restart: "no"
    networks:
      - traefik-public
    volumes:
      - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.${STACK_NAME?Variable not set}-maintenance.loadbalancer.server.port=80
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-http.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-http.priority=20000
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-https.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-maintenance-https.priority=20000

networks:
  traefik-public:
    external: true
