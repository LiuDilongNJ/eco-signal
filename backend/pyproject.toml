[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    "bcrypt<4.1.0,>=4.0.1",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "geoalchemy2>=0.18.1",
    "shapely>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "mutagen>=1.47.0",
    "aio-pika>=9.5.0",
    "redis>=5.0.0",
    "scikit-maad==1.5.2",
    "batdetect2>=0.1.0",
    "numba>=0.59.0",
    "resampy>=0.4.3",
    "tensorflow>=2.20.0",
    "autrainer>=0.8.2",
    "geopandas>=1.1.3",
    "fiona>=1.10.1",
    "pillow>=10.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pillow>=9.5.0,<10; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pymysql>=1.1.2",
    "openpyxl>=3.1.5,<4.0.0",
    "prometheus-client>=0.25.0",
    "birdnet-analyzer==2.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic", "app/ai/legacy_runtime"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "default",
    # Ignore RuntimeWarning from maad library (division by zero in acoustic indices)
    "ignore::RuntimeWarning:maad.*",
    "ignore::RuntimeWarning:numpy.*",
    # Ignore deprecation warnings from third-party libraries
    "ignore::DeprecationWarning:librosa.*",
    "ignore::DeprecationWarning:numba.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::DeprecationWarning:sklearn.*",
    "ignore:'aifc' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
    "ignore:'sunau' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:sqlmodel.*",
    "ignore::FutureWarning:librosa.*",
    "ignore::FutureWarning:scipy.*",
    "ignore::UserWarning:librosa.*",
    "ignore:PySoundFile failed. Trying audioread instead.:UserWarning",
    # Ignore Pydantic v1 compatibility warnings
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    # Do not hide SQLAlchemy warnings; fail fast to prevent query issues
    "error::sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"
omit = [
    "app/alembic/*",
    "app/ai/*/cli.py",
    "app/ai/legacy_runtime/*",
    "app/backend_pre_start.py",
    "app/tests_pre_start.py",
]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
