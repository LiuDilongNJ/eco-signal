global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "ecosignal-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: "ecosignal-host"
    static_configs:
      - targets: ["node-exporter:9100"]
